name: Bug
description: meydan did something it promises not to, or broke.
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: Steps, a failing test, or the webhook payload (remove phone numbers, ids and message text).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: meydan version
      placeholder: "v0.9.0"
    validations:
      required: true
