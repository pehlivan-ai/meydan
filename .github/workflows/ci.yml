name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: meydan
          POSTGRES_PASSWORD: meydan
          POSTGRES_DB: meydan_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U meydan" --health-interval 2s --health-retries 20
    env:
      MEYDAN_TEST_DATABASE_URL: postgresql+psycopg://meydan:meydan@localhost:5432/meydan_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Instance template is valid
        run: |
          cd templates/instance
          docker compose --env-file .env.example config --quiet
          bash -n deploy/deploy.sh scripts/gcp-setup.sh
