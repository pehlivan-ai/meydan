# README visuals: one entry per asset. The prompt is the source of truth; the image in
# docs/assets/readme/ is its chosen render. Regenerate with generate.py (see its header).

[style]
# Prepended to every prompt so all assets read as one set.
# Direction: a calm game world, a forgotten seaside settlement that exists within us;
# Aegean coast (Datça, Fethiye, Muğla) as seen by a boutique hotel's branding agency.
text = """
Stylized isometric 3D game diorama, true isometric camera, soft low-poly forms with
gently rounded edges, matte painted-clay materials, soft global illumination, tilt-shift
miniature feel, a light haze as in a half-remembered place. Quiet and timeless, no era,
no specific religion or nationality. Palette: sun-bleached off-white and lime-washed
stone, warm sand, pale sage and olive green, muted bougainvillea pink used sparingly,
calm Aegean turquoise water, one soft sea-teal accent. Editorial, airy, generous negative
space, like a boutique seaside hotel brand. No text, no letters, no logos, no UI,
no watermark.
"""

[assets.hero-light]
model = "openai/gpt-image-2.5-sunburst"
aspect_ratio = "21:9"
quality = "max"
background = "transparent"
size = [1600, 686]
prompt = """
A small forgotten settlement on a floating island fragment, like a level in a calm puzzle
game, isolated on a fully transparent background. A tiny cove of turquoise sea laps one
corner of the island with a little stone jetty and a moored wooden boat. Terraced
lime-washed houses with flat roofs and arched doorways, an old olive tree shading a small
open square with a stone well, steps climbing between walls, a lone bougainvillea, dry
stone walls, a few sun umbrellas. Tiny faceless figures stand in pairs and small groups;
above some float small rounded speech bubbles linked by thin soft-teal light arcs that
meet at a long shared table under the olive tree. The island's underside shows layered
rock tapering away. Bright morning light; the diorama is centered with empty space on
the left and right.
"""

[assets.hero-dark]
model = "openai/gpt-image-2.5-sunburst"
aspect_ratio = "21:9"
quality = "max"
background = "transparent"
size = [1600, 686]
references = ["hero-light"]
prompt = """
The exact same floating island as the reference image, same composition and camera, on a
fully transparent background, at blue hour: cool moonlit stone, warm small lanterns and
windows, the sea cove deep teal with soft reflections, the light arcs between people
glowing a little brighter. Keep every object in place.
"""

