[project]
name = "meydan"
version = "0.47.0"
description = "Primitives for running instances of personal and planning agents that coordinate people, one-to-one and in groups."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "pehlivan.ai" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
# primitives: optional parts an app takes only if it needs them
booking = [
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.2",
]
# Conversation runtime (Postgres 18+) and channel adapters (WhatsApp Cloud API).
runtime = [
    "httpx>=0.28",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.2",
]
# Bridges' stronger credentials: secrets sealed at rest (meydan.vault, AES-GCM) and public-key
# signatures (Standard Webhooks v2a, ed25519). Shared-secret (v1) bridges work without it.
bridge = [
    "cryptography>=43",
]
# HTTP surface: sign-in, sessions and scopes as FastAPI routes and dependencies (meydan.auth.web).
api = [
    "fastapi>=0.115",
]
# Photos people send, made ready for a model (meydan.media.prepare_image): upright, metadata
# gone, no larger than a model needs. Without it a received photo is kept as it came.
media = [
    "pillow>=11",
]
# Model layer: provider-agnostic models with fallback, retries and backpressure.
llm = [
    "httpx>=0.28",
    "tenacity>=9",
    "openai>=1.80",
    "pydantic-ai-slim[google,openrouter]>=2.61",
]
access = [
    "openfga-sdk>=0.10.5",
]
# Our email addresses' DNS checks (meydan.channels.email): MX, SPF, DKIM, DMARC.
email = [
    "dnspython>=2.6",
]
eval = [
    "pydantic-evals>=2.61",
]
notify = [
    "pywebpush>=2.0",
]

[project.urls]
Repository = "https://github.com/pehlivan-ai/meydan"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.162.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pillow>=11",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The instance template has its own tests; they run in a copy of it, not here.
testpaths = ["tests"]
